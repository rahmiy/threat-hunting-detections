title: Rundll32 LSASS Memory Dump via Comsvcs.dll
id: 9b4e7f2a-1d3c-4e8f-c5a6-3b0e4f9b2a1d
status: experimental
description: Detects rundll32 invocations referencing comsvcs.dll alongside the MiniDump function or ordinal 24. This is a well documented credential access technique used to dump LSASS process memory and extract credential material. Any occurrence of this pattern should be treated as a critical alert regardless of context.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://lolbas-project.github.io/lolbas/Binaries/Rundll32/
author: dcrowder252
date: 2026/09/05
modified: 2026/09/05
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\rundll32.exe'
    selection_comsvcs:
        CommandLine|contains: 'comsvcs'
    selection_minidump:
        CommandLine|contains:
            - 'MiniDump'
            - '#24'
    condition: selection_process and selection_comsvcs and selection_minidump
falsepositives:
    - Legitimate memory diagnostic tools that invoke comsvcs.dll MiniDump functionality
    - This combination is extremely rare in legitimate administrative activity and warrants investigation in virtually all cases
level: critical
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
