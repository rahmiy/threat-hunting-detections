title: Rundll32 Spawned by Suspicious Parent Process
id: 7e3b5f1a-4d2c-4e9f-a6d8-2b0f4e7c1a3d
status: experimental
description: Detects rundll32 spawned by parent processes commonly associated with phishing-based initial access including Office applications and scripting engines. This parent-child relationship is a strong indicator of malicious document or file execution using rundll32 for payload execution or AppLocker bypass.
references:
    - https://attack.mitre.org/techniques/T1218/011/
    - https://lolbas-project.github.io/lolbas/Binaries/Rundll32/
author: dcrowder252
date: 2026/09/05
modified: 2026/09/05
tags:
    - attack.defense_evasion
    - attack.t1218.011
    - attack.initial_access
    - attack.t1566.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\rundll32.exe'
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\explorer.exe'
    condition: selection_process and selection_parent
falsepositives:
    - Legitimate software installations that invoke rundll32 through scripting engines
    - explorer.exe may generate more noise than other parent processes and can be excluded if needed
    - Establish a baseline of approved rundll32 usage before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
